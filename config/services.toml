# Initial selection scopes, not a guarantee of a complete ChatGPT domain list.
# DNS-provider rewrites may affect descendants; publication validates exclusions.
[services.chatgpt]
enabled = true
include_suffixes = ["chatgpt.com", "openai.com", "oaistatic.com", "oaiusercontent.com"]
required_domains = ["chatgpt.com"]
exclude_suffixes = []
provider_order = ["geohide-ru", "geohide-eu"]
allow_subtree_rewrites = true

# Optional presets: reviewed against GeoHide RU hosts on 2026-10-08.
