name: CI

on:
  push:
    branches-ignore: [smartgate-state]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'tools/**'
      - 'requirements*.lock'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'tools/**'
      - 'requirements*.lock'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref != 'refs/heads/smartgate-state'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Offline tests
        run: python -m pytest -m "not live" -q
      - name: Documentation links
        run: python tools/check_docs.py
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Format
        run: python -m ruff format --check src tests tools
      - name: Types
        run: python -m mypy src
      - name: Build
        run: python -m build --no-isolation
      - name: Validate configuration
        run: python -m smartgate validate --config config/smartgate.example.toml
      - name: Validate Actions configuration
        run: python -m smartgate validate --config config/smartgate.actions.toml
      - name: Offline preview
        run: python -m smartgate preview --config config/smartgate.example.toml --offline --fixtures tests/fixtures
