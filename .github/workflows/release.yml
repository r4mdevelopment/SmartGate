name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching pyproject.toml and CHANGELOG.md (for example 0.1.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare reviewed notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python tools/release_notes.py --version "$RELEASE_VERSION" --output release-notes.md
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Offline tests
        run: python -m pytest -m "not live" -q
      - name: Quality checks
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check src tests tools
          python -m mypy src
          python tools/check_docs.py
          python -m smartgate validate --config config/smartgate.example.toml
          python -m smartgate validate --config config/smartgate.actions.toml
      - name: Build
        run: python -m build --no-isolation
      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          # Atomic ref creation refuses existing tags instead of overwriting them.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" -f sha="$GITHUB_SHA" --silent
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "SmartGate ${tag}" \
            --notes-file release-notes.md dist/*.whl dist/*.tar.gz
