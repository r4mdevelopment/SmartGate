name: SmartGate monitor

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      emergency_apply:
        description: Allow confirmed emergency replacements; requires failover and apply switches
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smartgate-monitor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  monitor:
    outputs:
      failover_needed: ${{ steps.observe.outputs.failover_needed }}
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.SMARTGATE_MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: smartgate
      deployment: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Observe published routes
        id: observe
        env:
          SMARTGATE_DNS_API_KEY: ${{ secrets.SMARTGATE_DNS_API_KEY || secrets.NEXTDNS_API_KEY }}
          SMARTGATE_DNS_PROFILE_ID: ${{ secrets.SMARTGATE_DNS_PROFILE_ID || vars.SMARTGATE_DNS_PROFILE_ID || secrets.NEXTDNS_PROFILE_ID || vars.NEXTDNS_PROFILE_ID }}
          SMARTGATE_DNS_USERNAME: ${{ secrets.SMARTGATE_DNS_USERNAME }}
          SMARTGATE_DNS_PASSWORD: ${{ secrets.SMARTGATE_DNS_PASSWORD }}
          SMARTGATE_DNS_API_URL: ${{ secrets.SMARTGATE_DNS_API_URL || vars.SMARTGATE_DNS_API_URL }}
          SMARTGATE_DNS_NAMESPACE: ${{ secrets.SMARTGATE_DNS_NAMESPACE || vars.SMARTGATE_DNS_NAMESPACE }}
          SMARTGATE_DNS_DOH_URL: ${{ secrets.SMARTGATE_DNS_DOH_URL || vars.SMARTGATE_DNS_DOH_URL }}
          NEXTDNS_API_KEY: ${{ secrets.NEXTDNS_API_KEY }}
          NEXTDNS_PROFILE_ID: ${{ secrets.NEXTDNS_PROFILE_ID || vars.NEXTDNS_PROFILE_ID }}
          SMARTGATE_STATE_ENCRYPTION_KEY: ${{ secrets.SMARTGATE_STATE_ENCRYPTION_KEY }}
          SMARTGATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m smartgate.monitor
      - name: Monitoring summary
        if: always()
        shell: bash
        run: |
          if [[ -f .smartgate/monitor/monitor.md ]]; then
            cat .smartgate/monitor/monitor.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# SmartGate route monitor' '' 'Collection failed before a protected report was available. Check workflow configuration.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save sanitized and encrypted observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smartgate-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .smartgate/monitor/monitor.json
            .smartgate/monitor/monitor.md
            .smartgate/monitor/monitor.enc.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  failover:
    needs: monitor
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.monitor.result == 'success' &&
      needs.monitor.outputs.failover_needed == 'true' &&
      vars.SMARTGATE_FAILOVER_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.emergency_apply == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: smartgate-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: smartgate
      deployment: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run controller
        shell: bash
        env:
          SMARTGATE_DNS_API_KEY: ${{ secrets.SMARTGATE_DNS_API_KEY || secrets.NEXTDNS_API_KEY }}
          SMARTGATE_DNS_PROFILE_ID: ${{ secrets.SMARTGATE_DNS_PROFILE_ID || vars.SMARTGATE_DNS_PROFILE_ID || secrets.NEXTDNS_PROFILE_ID || vars.NEXTDNS_PROFILE_ID }}
          SMARTGATE_DNS_USERNAME: ${{ secrets.SMARTGATE_DNS_USERNAME }}
          SMARTGATE_DNS_PASSWORD: ${{ secrets.SMARTGATE_DNS_PASSWORD }}
          SMARTGATE_DNS_API_URL: ${{ secrets.SMARTGATE_DNS_API_URL || vars.SMARTGATE_DNS_API_URL }}
          SMARTGATE_DNS_NAMESPACE: ${{ secrets.SMARTGATE_DNS_NAMESPACE || vars.SMARTGATE_DNS_NAMESPACE }}
          SMARTGATE_DNS_DOH_URL: ${{ secrets.SMARTGATE_DNS_DOH_URL || vars.SMARTGATE_DNS_DOH_URL }}
          SMARTGATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Temporary aliases for the existing adapter migration; conflicts fail closed.
          NEXTDNS_API_KEY: ${{ secrets.NEXTDNS_API_KEY }}
          NEXTDNS_PROFILE_ID: ${{ secrets.NEXTDNS_PROFILE_ID || vars.NEXTDNS_PROFILE_ID }}
          SMARTGATE_STATE_ENCRYPTION_KEY: ${{ secrets.SMARTGATE_STATE_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SMARTGATE_COMMAND: sync
          SMARTGATE_REQUEST_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_apply && vars.SMARTGATE_APPLY_ENABLED == 'true' || 'false' }}
          SMARTGATE_REQUIRE_NO_CHANGE: false
          SMARTGATE_BOOTSTRAP: false
          SMARTGATE_ROLLBACK_RUN_ID: ''
          SMARTGATE_APPLY_ENABLED: ${{ vars.SMARTGATE_APPLY_ENABLED || 'false' }}
          SMARTGATE_EMERGENCY_ONLY: true
          SMARTGATE_FAILOVER_ENABLED: ${{ vars.SMARTGATE_FAILOVER_ENABLED || 'false' }}
          SMARTGATE_EVENT: ${{ github.event_name }}
        run: |
          python -m smartgate.workflow
      - name: Public summary
        if: always()
        shell: bash
        run: |
          if [[ ! -f .smartgate/reports/report.md ]]; then
            mkdir -p .smartgate/reports
            printf '%s\n' '# SmartGate report' '' 'Controller did not produce a report. Check workflow setup and inspect durable state before retrying an apply.' > .smartgate/reports/report.md
            printf '%s\n' '{"status":"blocked","exit_code":5,"errors":["Controller report unavailable; inspect durable state before retry"]}' > .smartgate/reports/report.json
          fi
          cat .smartgate/reports/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save sanitized and encrypted reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smartgate-failover-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .smartgate/reports/report.json
            .smartgate/reports/report.md
            .smartgate/reports/report.enc.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
