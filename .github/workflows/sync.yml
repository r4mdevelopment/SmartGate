name: SmartGate sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: Controller command
        type: choice
        options: [preview, sync, doctor, recover, rollback, state-upgrade, state-encrypt]
        default: preview
      apply:
        description: Explicitly apply changes; state commands only update the ledger
        type: boolean
        default: false
      require_no_change:
        description: Acceptance only; refuse all DNS operations and pending recovery
        type: boolean
        default: false
      bootstrap:
        description: Explicit initialization of an empty DNS target and absent state
        type: boolean
        default: false
      rollback_run_id:
        description: Exact saved journal run ID for rollback
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: smartgate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    # Never execute secret-bearing controller code from a topic or state branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: smartgate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run controller
        shell: bash
        env:
          SMARTGATE_DNS_API_KEY: ${{ secrets.SMARTGATE_DNS_API_KEY || secrets.NEXTDNS_API_KEY }}
          SMARTGATE_DNS_PROFILE_ID: ${{ secrets.SMARTGATE_DNS_PROFILE_ID || vars.SMARTGATE_DNS_PROFILE_ID || secrets.NEXTDNS_PROFILE_ID || vars.NEXTDNS_PROFILE_ID }}
          SMARTGATE_DNS_USERNAME: ${{ secrets.SMARTGATE_DNS_USERNAME }}
          SMARTGATE_DNS_PASSWORD: ${{ secrets.SMARTGATE_DNS_PASSWORD }}
          SMARTGATE_DNS_API_URL: ${{ secrets.SMARTGATE_DNS_API_URL || vars.SMARTGATE_DNS_API_URL }}
          SMARTGATE_DNS_NAMESPACE: ${{ secrets.SMARTGATE_DNS_NAMESPACE || vars.SMARTGATE_DNS_NAMESPACE }}
          SMARTGATE_DNS_DOH_URL: ${{ secrets.SMARTGATE_DNS_DOH_URL || vars.SMARTGATE_DNS_DOH_URL }}
          SMARTGATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Temporary aliases for the existing adapter migration; conflicts fail closed.
          NEXTDNS_API_KEY: ${{ secrets.NEXTDNS_API_KEY }}
          NEXTDNS_PROFILE_ID: ${{ secrets.NEXTDNS_PROFILE_ID || vars.NEXTDNS_PROFILE_ID }}
          SMARTGATE_STATE_ENCRYPTION_KEY: ${{ secrets.SMARTGATE_STATE_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SMARTGATE_COMMAND: ${{ inputs.command || 'sync' }}
          SMARTGATE_REQUEST_APPLY: ${{ inputs.apply || 'false' }}
          SMARTGATE_REQUIRE_NO_CHANGE: ${{ inputs.require_no_change || 'false' }}
          SMARTGATE_BOOTSTRAP: ${{ inputs.bootstrap || 'false' }}
          SMARTGATE_ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
          SMARTGATE_APPLY_ENABLED: ${{ vars.SMARTGATE_APPLY_ENABLED || 'false' }}
          SMARTGATE_EVENT: ${{ github.event_name }}
        run: |
          python -m smartgate.workflow
      - name: Public summary
        if: always()
        shell: bash
        run: |
          if [[ ! -f .smartgate/reports/report.md ]]; then
            mkdir -p .smartgate/reports
            printf '%s\n' '# SmartGate report' '' 'Controller did not produce a report. Check workflow setup and inspect durable state before retrying an apply.' > .smartgate/reports/report.md
            printf '%s\n' '{"status":"blocked","exit_code":5,"errors":["Controller report unavailable; inspect durable state before retry"]}' > .smartgate/reports/report.json
          fi
          cat .smartgate/reports/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save sanitized and encrypted reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smartgate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .smartgate/reports/report.json
            .smartgate/reports/report.md
            .smartgate/reports/report.enc.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
